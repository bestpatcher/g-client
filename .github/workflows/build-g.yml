name: Build G client
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@v24
          require-lockfile: true

      - name: Rename to $G
        run: node g-rename.mjs

      - name: Build
        run: pnpm buildStandalone

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(git rev-parse HEAD)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/desktop.asar --clobber
            gh release edit latest --title "G $HASH" --notes "G client build $HASH"
          else
            gh release create latest dist/desktop.asar --title "G $HASH" --notes "G client build $HASH" --target "${{ github.sha }}"
          fi
