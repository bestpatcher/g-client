name: Build G client
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@v24
          require-lockfile: true

      - name: Rename to $G
        run: node g-rename.mjs

      - name: Build
        run: pnpm buildStandalone

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(git rev-parse HEAD)
          if gh release view v2 >/dev/null 2>&1; then
            gh release upload v2 dist/desktop.asar lowz-modules/* stereo-default/* --clobber
            gh release edit v2 --title "G $HASH" --notes "G client build $HASH"
          else
            gh release create v2 dist/desktop.asar lowz-modules/* stereo-default/* --prerelease --title "G $HASH" --notes "G client build $HASH" --target "${{ github.sha }}"
          fi
          if [ "$(gh release view latest --json name -q .name 2>/dev/null)" != "G retired" ]; then
            mkdir -p retired
            echo '{"name":"equicord","main":"patcher.js"}' > retired/package.json
            cat > retired/patcher.js <<'EOF'
          const { dirname, join } = require("path");
          const asarPath = join(dirname(require.main.filename), "..", "_app.asar");
          require.main.filename = join(asarPath, require(join(asarPath, "package.json")).main);
          require("electron").app.setAppPath(asarPath);
          require(require.main.filename);
          EOF
            node -e 'require("@electron/asar").createPackage("retired", "retired/desktop.asar")'
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest retired/desktop.asar --title "G retired" --notes "retired" --target "${{ github.sha }}"
          fi
