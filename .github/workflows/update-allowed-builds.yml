name: Update allowed installer builds
on:
  workflow_dispatch:
    inputs:
      hashes:
        description: "Comma-separated installer (dc-client) short git hashes still allowed to fetch $G"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manifest
        run: |
          python3 -c "
          import json, sys
          hashes = [h.strip() for h in '''${{ inputs.hashes }}'''.split(',') if h.strip()]
          json.dump({'allowed': hashes}, open('allowed-builds.json', 'w'))
          "
          cat allowed-builds.json

      - name: Upload to v2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v2 allowed-builds.json --clobber
